name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FE_VERSION: v26.5.1
  FOUNDRY_VERSION: v1.9.0

jobs:
  fe:
    name: Fe tests and milestone checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y bc xxd
      - run: fe --version
      - run: fe fmt --check ingots
      - run: fe test
      - run: fe build
      - run: bash tools/m1_check.sh
      - run: bash tools/m2_check.sh
      - run: bash tools/m3_check.sh

  fe-267:
    name: Same sources on Fe 26.7.0 (kernel, model, rule, contracts)
    runs-on: ubuntu-latest
    env:
      # The entry is pinned to 26.5.1 (the job above). This job shows that the four ingots that do
      # not use the native I/O API also pass `fe check` and `fe test` on the 26.7.0 release, from
      # the same source. `ingots/cli` needs 26.5.1, so tools/check_fe267.sh names each ingot.
      FE_267_URL: https://github.com/argotorg/fe/releases/download/v26.7.0/fe_linux_amd64
      FE_267_SHA256: 4ef2b818e260f0ba0b0af4bd78468dda589dc4949503fffaef25d8188e5107d5
    steps:
      - uses: actions/checkout@v5
      - name: Download the Fe 26.7.0 release binary and check its hash
        run: |
          mkdir -p "$HOME/fe-267"
          curl -fsSL -o "$HOME/fe-267/fe" "$FE_267_URL"
          echo "$FE_267_SHA256  $HOME/fe-267/fe" | sha256sum -c -
          chmod +x "$HOME/fe-267/fe"
      - run: FE267="$HOME/fe-267/fe" bash tools/check_fe267.sh

  wasm:
    name: WebAssembly build (Fe master, pinned)
    runs-on: ubuntu-latest
    env:
      # The wasm target is on master only (argotorg/fe PR 1904); keep in step with tools/build_wasm.sh.
      FE_MASTER: 89d07b9dbf7ea73d0ca6b9a5b4f14de7899d1908
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/checkout@v5
        with:
          repository: argotorg/fe
          ref: ${{ env.FE_MASTER }}
          path: fe-master
          submodules: recursive
          # Full history, so `fe --version` abbreviates the commit as a local clone does (89d07b9db):
          # the manifest records that string, and the committed module must match byte for byte.
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fe-master/target
          key: fe-master-${{ env.FE_MASTER }}
      - name: Build fe at the pinned commit, with the wasm feature
        working-directory: fe-master
        run: |
          (cd crates/tree-sitter-fe && npm ci --no-audit --no-fund)
          PATH="$PWD/crates/tree-sitter-fe/node_modules/.bin:$PATH" cargo build --release -p fe --features wasm
      - name: Flatten, unit tests on wasm, two identical builds, 10,000-image differential
        run: FE="$PWD/fe-master/target/release/fe" bash tools/build_wasm.sh
      - name: The committed module is the module these sources build
        run: git diff --exit-code wasm/

  reference:
    name: NumPy reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install numpy==2.3.3
      - run: python ref/get_mnist.py
      - run: python ref/test_ref.py

  demo:
    name: Demo page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
        working-directory: demo
      - run: npm run build
        working-directory: demo
      - name: The committed page is the page these sources build
        run: git diff --exit-code demo/dist/tensile-demo.html
      - run: npm test
        working-directory: demo
      - run: npx playwright install --with-deps chromium
        working-directory: demo
      - run: npm run test:ui
        working-directory: demo
        env:
          PLAYWRIGHT_BUNDLED: "1"
