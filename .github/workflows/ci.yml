name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FE_VERSION: v26.5.1
  FOUNDRY_VERSION: v1.9.0

jobs:
  fe:
    name: Fe tests and milestone checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y bc xxd
      - run: fe --version
      - run: fe fmt --check ingots
      - run: fe test
      - run: fe build
      - run: bash tools/m1_check.sh
      - run: bash tools/m2_check.sh
      - run: bash tools/m3_check.sh

  fe-267:
    name: Same sources on Fe 26.7.0 (kernel, model, rule, contracts)
    runs-on: ubuntu-latest
    env:
      # The entry is pinned to 26.5.1 (the job above). This job shows that the four ingots that do
      # not use the native I/O API also pass `fe check` and `fe test` on the 26.7.0 release, from
      # the same source. `ingots/cli` needs 26.5.1, so tools/check_fe267.sh names each ingot.
      FE_267_URL: https://github.com/argotorg/fe/releases/download/v26.7.0/fe_linux_amd64
      FE_267_SHA256: 4ef2b818e260f0ba0b0af4bd78468dda589dc4949503fffaef25d8188e5107d5
    steps:
      - uses: actions/checkout@v5
      - name: Download the Fe 26.7.0 release binary and check its hash
        run: |
          mkdir -p "$HOME/fe-267"
          curl -fsSL -o "$HOME/fe-267/fe" "$FE_267_URL"
          echo "$FE_267_SHA256  $HOME/fe-267/fe" | sha256sum -c -
          chmod +x "$HOME/fe-267/fe"
      - run: FE267="$HOME/fe-267/fe" bash tools/check_fe267.sh
      - name: The library examples on 26.7.0 (lib-examples/, docs/LIBRARY.md)
        run: FE267="$HOME/fe-267/fe" bash tools/check_fe267_lib.sh
      - name: The library guide's walkthrough on 26.7.0, from an empty directory
        run: FE="$HOME/fe-267/fe" bash lib-examples/walkthrough.sh

  wasm:
    name: WebAssembly build (Fe 26.7.0 release)
    runs-on: ubuntu-latest
    env:
      # The wasm target ships in the release binaries from 26.7.0, the first release that builds an
      # ingot for it; keep in step with tools/build_wasm.sh and the fe-267 job above.
      FE_267_URL: https://github.com/argotorg/fe/releases/download/v26.7.0/fe_linux_amd64
      FE_267_SHA256: 4ef2b818e260f0ba0b0af4bd78468dda589dc4949503fffaef25d8188e5107d5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Download the Fe 26.7.0 release binary and check its hash
        run: |
          mkdir -p "$HOME/fe-267"
          curl -fsSL -o "$HOME/fe-267/fe" "$FE_267_URL"
          echo "$FE_267_SHA256  $HOME/fe-267/fe" | sha256sum -c -
          chmod +x "$HOME/fe-267/fe"
      - name: Unit tests on wasm, two identical builds, 10,000-image differential
        run: FE="$HOME/fe-267/fe" bash tools/build_wasm.sh
      - name: The committed module is the module these sources build
        run: git diff --exit-code wasm/

  reference:
    name: NumPy reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install numpy==2.3.3
      - run: python ref/get_mnist.py
      - run: python ref/test_ref.py

  demo:
    name: Demo page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
        working-directory: demo
      - run: npm run build
        working-directory: demo
      - name: The committed page is the page these sources build
        run: git diff --exit-code demo/dist/tensile-demo.html
      - run: npm test
        working-directory: demo
      - run: npx playwright install --with-deps chromium
        working-directory: demo
      - run: npm run test:ui
        working-directory: demo
        env:
          PLAYWRIGHT_BUNDLED: "1"

  fee-demo:
    name: Fee-tier demo page (examples/amm-fee in the browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # The reference inputs and labels are not committed: rebuilt from the ticks, standard library only.
      - run: python3 -I examples/amm-fee/dataset.py
      - run: npm ci
        working-directory: demo
      - run: npm run build:fee
        working-directory: demo
      - name: The committed page is the page these sources build
        run: git diff --exit-code demo/dist/tensile-fee.html
      - run: npm run test:fee
        working-directory: demo
      - run: npx playwright install --with-deps chromium
        working-directory: demo
      - run: npm run test:fee-ui
        working-directory: demo
        env:
          PLAYWRIGHT_BUNDLED: "1"

  fee-demo-bytecode:
    name: Fee-tier demo embeds exactly what fe build produces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - name: demo/generated/fee-assets.json equals what fe build of examples/amm-fee and the committed data give
        run: bash demo/fee_assets.sh --check

  lib-examples:
    name: The kernel as a library (lib-examples/, docs/LIBRARY.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: fe --version
      # fmt, check, the tests on both backends, the compile-fail cases, fe build, gas on anvil.
      - run: bash lib-examples/check.sh
      - name: The recorded gas and sizes are what this run produced
        run: git diff --exit-code lib-examples/runs/gas.json
      - name: The guide's walkthrough, from an empty directory
        run: bash lib-examples/walkthrough.sh
      - name: The API documentation builds (published by pages.yml)
        run: bash tools/api_docs.sh "$RUNNER_TEMP/api" && test -s "$RUNNER_TEMP/api/docs.json"
