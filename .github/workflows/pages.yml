name: Demo page

# Publishes the landing page (site/), the demo (demo/dist/tensile-demo.html, at /demo/) and the video,
# so that nothing needs a download.
# One setup step in the repository: Settings, Pages, Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: [demo/dist/**, site/**, demo/video/tensile-demo.mp4, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Pages needs a public repository on a free plan; the job waits until the repository is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p _site/demo _site/sepolia
          cp site/* _site/
          cp demo/dist/tensile-demo.html _site/demo/index.html
          cp demo/dist/tensile-sepolia.html _site/sepolia/index.html
          cp demo/video/tensile-demo.mp4 _site/
      - name: The fee-tier demo (demo/dist/tensile-fee.html), at /fee/
        run: |
          mkdir -p _site/fee
          cp demo/dist/tensile-fee.html _site/fee/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
